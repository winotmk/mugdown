name: Build mugdown desktop
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
    branches: ['main', 'codex/**']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mugdown-windows-x64
          # Use a stable Intel host; the output still includes both architectures.
          - os: macos-15-intel
            target: universal-apple-darwin
            artifact: mugdown-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Test macOS backend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm run build
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --features custom-protocol --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build desktop application
        id: desktop_build
        run: npm run tauri -- build --ci --target ${{ matrix.target }} -- --locked
      - name: Check macOS universal app and startup
        if: runner.os == 'macOS'
        run: bash scripts/check-macos-bundle.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/mugdown.app
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.desktop_build.outcome == 'success' }}
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/${{ matrix.target }}/release/mugdown.exe
          if-no-files-found: error
